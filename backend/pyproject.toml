[project]
name = "optoputs-backend"
version = "0.1.0"
description = "OptoPuts vol engine, Graph adapter, Claude agent, FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "anthropic>=0.100",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["vol_engine/tests", "graph", "agent", "tests"]

[tool.uv]
package = false
