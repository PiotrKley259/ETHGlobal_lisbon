name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OFFLINE_MODE: "1" # fixtures only — CI has no Graph/Anthropic/Hedera keys
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker Hub pulls from shared runner IPs flake (timeouts / rate
      # limits); retry before declaring the build broken.
      - run: |
          for attempt in 1 2 3; do
            docker build -t optoputs . && exit 0
            echo "::warning::docker build attempt $attempt failed — retrying in 30s"
            sleep 30
          done
          exit 1

  # Push-to-deploy: any push to main that passes the three check jobs deploys
  # both halves. Requires two repo secrets (Settings → Secrets → Actions):
  #   OPTOPUTS_RAILWAY — Railway project token (project settings → Tokens)
  #   OPTOPUTS_VERCEL  — Vercel personal token (account settings → Tokens)
  # Until the secrets exist each step skips with a notice instead of failing.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Redeploying the backend recreates the Hedera stablecoin/topic/customer
      # from scratch every time (Railway's container fs is ephemeral, so
      # state.json can't survive) — each redeploy funds a brand-new customer
      # account from the treasury. Only worth doing when backend-relevant
      # files actually changed; a pure frontend/docs commit must not burn
      # testnet HBAR for nothing.
      - name: Check for backend-relevant changes
        id: backend_diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" HEAD -- backend hedera-sidecar fixtures Dockerfile deploy .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy backend + sidecar to Railway
        if: steps.backend_diff.outputs.changed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.OPTOPUTS_RAILWAY }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN secret not set — skipping backend deploy"
            exit 0
          fi
          npx -y @railway/cli@latest up --service optoputs --detach
      - name: Skip backend deploy (no backend-relevant changes)
        if: steps.backend_diff.outputs.changed == 'false'
        run: echo "::notice::No backend/sidecar/fixtures/Dockerfile changes — skipping Railway redeploy to avoid burning testnet HBAR"
      - name: Deploy frontend to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.OPTOPUTS_VERCEL }}
          VERCEL_ORG_ID: team_IwcdnhTDIPG5bKWZJtNdJ2me
          VERCEL_PROJECT_ID: prj_9lGShnMUKTIYsC2qYqNh3z5SRCLw
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret not set — skipping frontend deploy"
            exit 0
          fi
          npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
