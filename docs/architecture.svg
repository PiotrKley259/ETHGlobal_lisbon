<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5C1230"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7D1D3F"/>
    </marker>
    <marker id="aq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93707A"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FAF2EE"/>

  <!-- header -->
  <text x="60" y="52" font-size="27" font-weight="600" letter-spacing="-0.4" fill="#5C1230">OptoPuts</text>
  <text x="200" y="52" font-size="12" fill="#93707A">an insurance for your wallet — ETH &amp; WBTC options desk</text>
  <text x="1140" y="52" font-size="10.5" letter-spacing="1.6" fill="#93707A" text-anchor="end">THE GRAPH · CLAUDE · HEDERA</text>
  <line x1="60" y1="76" x2="1140" y2="76" stroke="rgba(92,18,48,.24)" stroke-width="1"/>

  <!-- lane headers -->
  <text x="60"  y="112" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#93707A">BROWSER</text>
  <text x="360" y="112" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#93707A">AGENT CORE — FASTAPI</text>
  <text x="880" y="112" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#93707A">LIVE DATA &amp; CHAIN</text>

  <!-- ═══ browser lane ═══ -->
  <rect x="60" y="132" width="220" height="196" rx="10" fill="rgba(125,29,63,.05)"/>
  <text x="76" y="158" font-size="15" font-weight="600" fill="#2A0A12">React UI</text>
  <rect x="76" y="172" width="188" height="38" fill="none" stroke="#2A0A12" stroke-width="1.4"/>
  <text x="86" y="195" font-size="12" fill="#2A0A12">chat · tool-call chips</text>
  <rect x="76" y="218" width="188" height="38" fill="none" stroke="#2A0A12" stroke-width="1.4"/>
  <text x="86" y="235" font-size="12" fill="#2A0A12">pricing panel · vol curve</text>
  <text x="86" y="249" font-size="10.5" fill="#93707A">payoff diagram · regime</text>
  <rect x="76" y="264" width="188" height="38" fill="none" stroke="#2A0A12" stroke-width="1.4"/>
  <text x="86" y="281" font-size="12" fill="#2A0A12">chain strip</text>
  <text x="86" y="295" font-size="10.5" fill="#93707A">hashscan links · armed→paid</text>

  <!-- browser <-> backend -->
  <line x1="280" y1="196" x2="348" y2="196" stroke="#5C1230" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="314" y="186" font-size="10.5" fill="#5C1230" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace">POST /chat</text>
  <line x1="348" y1="238" x2="280" y2="238" stroke="#93707A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aq)"/>
  <text x="314" y="258" font-size="10.5" fill="#93707A" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace">SSE</text>
  <text x="314" y="271" font-size="9.5" fill="#93707A" text-anchor="middle">tokens · panel · chain</text>

  <!-- ═══ backend container ═══ -->
  <rect x="350" y="132" width="430" height="366" rx="10" fill="none" stroke="rgba(92,18,48,.4)" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- octopus agent -->
  <g>
    <!-- tentacles (become the tool-call arrows) -->
    <path d="M540,262 C520,300 490,300 470,336" fill="none" stroke="#7D1D3F" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>
    <path d="M580,264 C600,300 650,300 668,336" fill="none" stroke="#7D1D3F" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>
    <path d="M598,238 C700,240 790,300 872,352" fill="none" stroke="#7D1D3F" stroke-width="3" stroke-linecap="round" marker-end="url(#ab)"/>
    <path d="M522,248 C500,270 480,262 466,278" fill="none" stroke="#7D1D3F" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <!-- head -->
    <circle cx="560" cy="222" r="40" fill="#7D1D3F"/>
    <circle cx="546" cy="216" r="6.5" fill="#FAF2EE"/>
    <circle cx="574" cy="216" r="6.5" fill="#FAF2EE"/>
    <circle cx="548" cy="218" r="2.6" fill="#2A0A12"/>
    <circle cx="576" cy="218" r="2.6" fill="#2A0A12"/>
    <path d="M549,238 Q560,246 571,238" fill="none" stroke="#FAF2EE" stroke-width="2" stroke-linecap="round"/>
    <text x="560" y="291" font-size="15" font-weight="600" fill="#2A0A12" text-anchor="middle">Claude agent</text>
    <text x="560" y="306" font-size="10.5" fill="#93707A" text-anchor="middle">tool use · computes nothing</text>
  </g>

  <!-- vol engine -->
  <rect x="372" y="338" width="188" height="74" fill="none" stroke="#2A0A12" stroke-width="1.4"/>
  <text x="384" y="360" font-size="15" font-weight="600" fill="#2A0A12">vol engine</text>
  <text x="384" y="377" font-size="10.5" fill="#2A0A12">BS + Greeks · vol curve σ(T)</text>
  <text x="384" y="391" font-size="10.5" fill="#2A0A12">strategies · regime</text>
  <text x="384" y="405" font-size="9.5" fill="#93707A" font-family="SFMono-Regular,Menlo,monospace">pure math · MCP · 86 tests</text>

  <!-- graph adapter -->
  <rect x="580" y="338" width="180" height="74" fill="none" stroke="#2A0A12" stroke-width="1.4"/>
  <text x="592" y="360" font-size="15" font-weight="600" fill="#2A0A12">Graph adapter</text>
  <text x="592" y="377" font-size="10.5" fill="#2A0A12">cached fetchers · TTL</text>
  <text x="592" y="391" font-size="10.5" fill="#2A0A12">per-pool inversion</text>
  <text x="592" y="405" font-size="9.5" fill="#93707A" font-family="SFMono-Regular,Menlo,monospace">OFFLINE_MODE=1 → fixtures</text>

  <!-- settlement worker -->
  <rect x="452" y="432" width="256" height="46" fill="none" stroke="#5C1230" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="580" y="451" font-size="12" font-weight="600" fill="#5C1230" text-anchor="middle">settlement worker</text>
  <text x="580" y="466" font-size="10.5" fill="#93707A" text-anchor="middle">pays max(0, K−S) at expiry · idempotent</text>

  <!-- ═══ right lane ═══ -->
  <rect x="880" y="132" width="260" height="118" fill="none" stroke="#2A0A12" stroke-width="1.4"/>
  <text x="896" y="158" font-size="15" font-weight="600" fill="#2A0A12">The Graph gateway</text>
  <text x="896" y="178" font-size="10.5" fill="#2A0A12">Uniswap v3 · ETH &amp; WBTC/USDC pools</text>
  <text x="896" y="193" font-size="10.5" fill="#2A0A12">hourly OHLC → realized vol + spot</text>
  <text x="896" y="212" font-size="10.5" fill="#2A0A12">Aave v3 · USDC borrow rate → r</text>
  <text x="896" y="234" font-size="9.5" fill="#93707A" font-family="SFMono-Regular,Menlo,monospace">decentralized network · GraphQL</text>

  <rect x="880" y="342" width="260" height="136" fill="none" stroke="#7D1D3F" stroke-width="1.8"/>
  <text x="896" y="368" font-size="15" font-weight="600" fill="#2A0A12">Hedera sidecar</text>
  <text x="1128" y="368" font-size="9.5" fill="#93707A" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace">Node · Hiero SDK</text>
  <text x="896" y="390" font-size="10.5" fill="#2A0A12">HTS — each option series is a token</text>
  <text x="896" y="406" font-size="10.5" fill="#2A0A12">HCS — tamper-proof quote/trade log</text>
  <text x="896" y="422" font-size="10.5" fill="#2A0A12">Scheduled Tx — settlement commitment</text>
  <text x="896" y="444" font-size="9.5" fill="#93707A" font-family="SFMono-Regular,Menlo,monospace">testnet · idempotent per token</text>
  <text x="896" y="464" font-size="9.5" fill="#7D1D3F" font-family="SFMono-Regular,Menlo,monospace">stablecoin payout → your wallet</text>

  <!-- adapter -> graph gateway -->
  <path d="M762,352 C820,320 840,250 872,210" fill="none" stroke="#5C1230" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="864" y="238" font-size="10.5" fill="#5C1230" font-family="SFMono-Regular,Menlo,monospace" text-anchor="end">GraphQL</text>

  <!-- worker -> sidecar (dashed loop, like a feedback line) -->
  <path d="M710,455 C780,462 820,458 872,446" fill="none" stroke="#93707A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aq)"/>
  <text x="784" y="494" font-size="9.5" fill="#93707A" font-family="SFMono-Regular,Menlo,monospace">/settlement/execute</text>

  <!-- tentacle label -->
  <text x="742" y="320" font-size="10.5" fill="#7D1D3F" font-family="SFMono-Regular,Menlo,monospace">mint · log · arm</text>

  <!-- footer -->
  <line x1="60" y1="540" x2="1140" y2="540" stroke="rgba(92,18,48,.24)" stroke-width="1"/>
  <text x="60" y="566" font-size="10.5" letter-spacing="1.6" font-weight="600" fill="#93707A">HARD RULE</text>
  <text x="60" y="586" font-size="12" fill="#2A0A12">The agent computes nothing — every number on screen comes from deterministic, tested Python, and every trade settles itself on-chain.</text>
  <text x="1140" y="586" font-size="10.5" fill="#93707A" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace">demo-graph ✓ · demo-full ✓</text>
</svg>
