<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E58BA4"/>
    </marker>
    <marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B08894"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#2B0912"/>

  <!-- header -->
  <text x="60" y="58" font-size="28" font-weight="600" letter-spacing="-0.4" fill="#F5E6DC">OptoPuts</text>
  <text x="205" y="58" font-size="12.5" fill="#B08894">an insurance for your wallet — ETH &amp; WBTC options, priced on live data, settled on-chain</text>
  <text x="1140" y="58" font-size="10.5" letter-spacing="2" fill="#B08894" text-anchor="end">THE GRAPH · CLAUDE · HEDERA</text>
  <line x1="60" y1="82" x2="1140" y2="82" stroke="#5A1F31" stroke-width="1"/>

  <text x="60" y="120" font-size="10.5" font-weight="600" letter-spacing="2" fill="#D96A88">LIFE OF A TRADE</text>

  <!-- ═══ five stages, one axis, no crossings ═══ -->
  <!-- connecting arrows -->
  <line x1="252" y1="250" x2="276" y2="250" stroke="#E58BA4" stroke-width="2" marker-end="url(#fw)"/>
  <line x1="474" y1="250" x2="498" y2="250" stroke="#E58BA4" stroke-width="2" marker-end="url(#fw)"/>
  <line x1="696" y1="250" x2="720" y2="250" stroke="#E58BA4" stroke-width="2" marker-end="url(#fw)"/>
  <line x1="918" y1="250" x2="942" y2="250" stroke="#E58BA4" stroke-width="2" marker-end="url(#fw)"/>

  <!-- 01 ASK -->
  <rect x="60" y="150" width="192" height="200" rx="8" fill="#3D0E1E" stroke="#7D2C46" stroke-width="1.4"/>
  <text x="76" y="184" font-size="22" font-weight="600" fill="#D96A88">01</text>
  <text x="76" y="208" font-size="14.5" font-weight="600" fill="#F5E6DC">Ask in English</text>
  <text x="76" y="232" font-size="10.5" fill="#E9CFC2">“protect my ETH</text>
  <text x="76" y="246" font-size="10.5" fill="#E9CFC2">below $1,800 this week”</text>
  <text x="76" y="268" font-size="10.5" fill="#B08894">chat streams back over SSE:</text>
  <text x="76" y="282" font-size="10.5" fill="#B08894">tool calls · panel · chain events</text>
  <text x="76" y="330" font-size="9.5" fill="#D96A88" font-family="SFMono-Regular,Menlo,monospace">React · FastAPI · Claude</text>

  <!-- 02 MEASURE -->
  <rect x="282" y="150" width="192" height="200" rx="8" fill="#3D0E1E" stroke="#7D2C46" stroke-width="1.4"/>
  <text x="298" y="184" font-size="22" font-weight="600" fill="#D96A88">02</text>
  <text x="298" y="208" font-size="14.5" font-weight="600" fill="#F5E6DC">Measure the market</text>
  <text x="298" y="232" font-size="10.5" fill="#E9CFC2">Uniswap v3 hourly OHLC -> </text>
  <text x="298" y="246" font-size="10.5" fill="#E9CFC2">realized-vol curve σ(T)</text>
  <text x="298" y="260" font-size="10.5" fill="#E9CFC2">Aave v3 USDC borrow -> r</text>
  <text x="298" y="282" font-size="10.5" fill="#B08894">regime: calm / elevated / stressed</text>
  <text x="298" y="296" font-size="10.5" fill="#B08894">(your thresholds, not ours)</text>
  <text x="298" y="330" font-size="9.5" fill="#D96A88" font-family="SFMono-Regular,Menlo,monospace">The Graph gateway</text>

  <!-- 03 PRICE -->
  <rect x="504" y="150" width="192" height="200" rx="8" fill="#4A1226" stroke="#D96A88" stroke-width="1.8"/>
  <text x="520" y="184" font-size="22" font-weight="600" fill="#E58BA4">03</text>
  <text x="520" y="208" font-size="14.5" font-weight="600" fill="#F5E6DC">Price it in code</text>
  <text x="520" y="232" font-size="10.5" fill="#E9CFC2">Black–Scholes + Greeks</text>
  <text x="520" y="246" font-size="10.5" fill="#E9CFC2">single legs or 8 strategies</text>
  <text x="520" y="260" font-size="10.5" fill="#E9CFC2">payoff curve · breakevens</text>
  <text x="520" y="330" font-size="9.5" fill="#D96A88" font-family="SFMono-Regular,Menlo,monospace">pure math · MCP </text>

  <!-- 04 MINT -->
  <rect x="726" y="150" width="192" height="200" rx="8" fill="#3D0E1E" stroke="#7D2C46" stroke-width="1.4"/>
  <text x="742" y="184" font-size="22" font-weight="600" fill="#D96A88">04</text>
  <text x="742" y="208" font-size="14.5" font-weight="600" fill="#F5E6DC">Mint on confirm</text>
  <text x="742" y="232" font-size="10.5" fill="#E9CFC2">coverage-gated: the desk</text>
  <text x="742" y="246" font-size="10.5" fill="#E9CFC2">never sells what it can’t pay</text>
  <text x="742" y="268" font-size="10.5" fill="#B08894">HTS series token minted</text>
  <text x="742" y="282" font-size="10.5" fill="#B08894">HCS audit log · settlement armed</text>
  <text x="742" y="330" font-size="9.5" fill="#D96A88" font-family="SFMono-Regular,Menlo,monospace">Hedera sidecar · Hiero SDK</text>

  <!-- 05 SETTLE -->
  <rect x="948" y="150" width="192" height="200" rx="8" fill="#3D0E1E" stroke="#7D2C46" stroke-width="1.4"/>
  <text x="964" y="184" font-size="22" font-weight="600" fill="#D96A88">05</text>
  <text x="964" y="208" font-size="14.5" font-weight="600" fill="#F5E6DC">Settle itself</text>
  <text x="964" y="232" font-size="10.5" fill="#E9CFC2">at expiry the worker reads</text>
  <text x="964" y="246" font-size="10.5" fill="#E9CFC2">live spot and pays</text>
  <text x="964" y="260" font-size="10.5" fill="#E9CFC2">max(0, K−S) in stablecoin</text>
  <text x="964" y="282" font-size="10.5" fill="#B08894">idempotent — can never</text>
  <text x="964" y="296" font-size="10.5" fill="#B08894">pay the same series twice</text>
  <text x="964" y="330" font-size="9.5" fill="#D96A88" font-family="SFMono-Regular,Menlo,monospace">auto · no action needed</text>

  <!-- ═══ on-chain trail ═══ -->
  <text x="60" y="420" font-size="10.5" font-weight="600" letter-spacing="2" fill="#D96A88">THE ON-CHAIN TRAIL — EVERY STEP VERIFIABLE ON HASHSCAN</text>

  <rect x="60" y="440" width="228" height="56" rx="6" fill="none" stroke="#5A1F31" stroke-width="1.2"/>
  <text x="76" y="463" font-size="11.5" font-weight="600" fill="#F5E6DC">option token</text>
  <text x="76" y="481" font-size="9.5" fill="#B08894" font-family="SFMono-Regular,Menlo,monospace">HTS · strike/expiry in metadata</text>

  <rect x="344" y="440" width="228" height="56" rx="6" fill="none" stroke="#5A1F31" stroke-width="1.2"/>
  <text x="360" y="463" font-size="11.5" font-weight="600" fill="#F5E6DC">trade record</text>
  <text x="360" y="481" font-size="9.5" fill="#B08894" font-family="SFMono-Regular,Menlo,monospace">HCS topic · tamper-proof log</text>

  <rect x="628" y="440" width="228" height="56" rx="6" fill="none" stroke="#5A1F31" stroke-width="1.2"/>
  <text x="644" y="463" font-size="11.5" font-weight="600" fill="#F5E6DC">settlement armed</text>
  <text x="644" y="481" font-size="9.5" fill="#B08894" font-family="SFMono-Regular,Menlo,monospace">Scheduled Tx · HIP-423</text>

  <rect x="912" y="440" width="228" height="56" rx="6" fill="none" stroke="#D96A88" stroke-width="1.4"/>
  <text x="928" y="463" font-size="11.5" font-weight="600" fill="#F5E6DC">payout → your wallet</text>
  <text x="928" y="481" font-size="9.5" fill="#E58BA4" font-family="SFMono-Regular,Menlo,monospace">stablecoin transfer + HCS record</text>

  <line x1="288" y1="468" x2="338" y2="468" stroke="#B08894" stroke-width="1.4" marker-end="url(#fm)"/>
  <line x1="572" y1="468" x2="622" y2="468" stroke="#B08894" stroke-width="1.4" marker-end="url(#fm)"/>
  <line x1="856" y1="468" x2="906" y2="468" stroke="#B08894" stroke-width="1.4" marker-end="url(#fm)"/>

  <!-- footer -->
  <line x1="60" y1="548" x2="1140" y2="548" stroke="#5A1F31" stroke-width="1"/>
  <text x="60" y="580" font-size="12" fill="#E9CFC2">Live data is load-bearing: the panel shows the exact vol, curve and regime that produced every price — the agent can’t hallucinate a number it never computed.</text>
  <text x="1140" y="608" font-size="9.5" fill="#B08894" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace">OFFLINE_MODE=1 → full demo from fixtures · demo-graph ✓ · demo-full ✓</text>
</svg>
